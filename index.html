<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repayment Overview</title>
<style>
body { font-family: -apple-system, sans-serif; background: #f4f7f6; margin: 0; padding: 15px; display: flex; justify-content: center; }
.container { background: white; width: 100%; max-width: 400px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; padding-bottom: 20px; }
.top-header { display: flex; align-items: center; padding: 15px; font-size: 18px; font-weight: 500; color: #333; border-bottom: 1px solid #eee; }
.brand-section { display: flex; align-items: center; padding: 20px; }
.brand-logo { width: 45px; height: 45px; background: #f9ab00; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; font-size: 24px; font-weight: bold; margin-right: 15px; }
.brand-name { font-size: 20px; font-weight: bold; color: #111; }
.card-box { background: #fff; border: 1px solid #eee; border-radius: 12px; margin: 0 15px; padding: 15px; }
.row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 15px; }
.label { color: #5f6368; }
.value { font-weight: 600; color: #202124; }
.main-pay-btn { width: calc(100% - 30px); margin: 20px 15px 0 15px; background: #1a73e8; color: white; border: none; padding: 16px; border-radius: 25px; font-size: 16px; font-weight: bold; cursor: pointer; text-align: center; display: block; box-sizing: border-box;}
</style>
</head>
<body>
<div class="container">
    <div class="top-header">&lt; Repayment Overview</div>
    <div class="brand-section">
        <div class="brand-logo">₹</div>
        <div class="brand-name" id="display-title">Cash Kingdom</div>
    </div>
    <div class="card-box">
        <div class="row"><span class="label">Name</span><span class="value" id="overview-name">Aditya Kumar</span></div>
        <div class="row"><span class="label">Loan Amount</span><span class="value">₹ <span id="overview-amount">4,500</span></span></div>
        <div class="row"><span class="label">Total Repayment</span><span class="value" style="font-size:18px;">₹ <span id="overview-total">4,500</span></span></div>
    </div>
    <button class="main-pay-btn" onclick="alert('Proceed to pay')">Pay Total Due (₹ <span id="btn-amount">4,500</span>)</button>
</div>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    if(urlParams.get('amntInput')) {
        let amt = urlParams.get('amntInput');
        document.getElementById('overview-amount').innerText = amt;
        document.getElementById('overview-total').innerText = amt;
        document.getElementById('btn-amount').innerText = amt;
    }
    if(urlParams.get('nameInput')) {
        document.getElementById('overview-name').innerText = decodeURIComponent(urlParams.get('nameInput'));
    }
    if(urlParams.get('titleInput')) {
        document.getElementById('display-title').innerText = decodeURIComponent(urlParams.get('titleInput'));
    }
</script>
</body>
</html>
